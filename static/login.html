<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · Agent-SIP</title><style>
:root{color-scheme:dark;--bg:#0a0e14;--card:#151d28;--input:#1a232f;--border:#2a3744;--text:#e6edf3;--muted:#8b949e;--orange:#f0883e;--orange2:#db6d28;--red:#f85149}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}.card{width:min(360px,calc(100% - 32px));padding:28px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 35px #0008}.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.logo{display:grid;place-items:center;width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,var(--orange),var(--orange2));font-weight:800}.brand h1{font-size:20px;margin:0}.brand p{margin:0;color:var(--muted);font-size:12px}label{display:block;color:var(--muted);font-size:11px;margin:12px 0 4px}input,button{width:100%;border-radius:6px;padding:10px;border:1px solid var(--border)}input{background:var(--input);color:var(--text);outline:none}input:focus{border-color:var(--orange)}button{margin-top:18px;border:0;color:white;font-weight:650;background:linear-gradient(135deg,var(--orange),var(--orange2));cursor:pointer}.error{min-height:21px;margin-top:12px;color:var(--red);text-align:center}
</style></head><body><form class="card" id="login"><div class="brand"><div class="logo">AS</div><div><h1>Agent-SIP</h1><p>Sign in to continue</p></div></div><label for="username">Username</label><input id="username" name="username" autocomplete="username" required autofocus><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Sign in</button><div class="error" id="error"></div></form><script>
document.getElementById('login').addEventListener('submit',async event=>{event.preventDefault();const error=document.getElementById('error');error.textContent='';const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:event.target.username.value,password:event.target.password.value})});if(response.ok)location.href='/';else error.textContent='Invalid username or password'});
</script></body></html>
