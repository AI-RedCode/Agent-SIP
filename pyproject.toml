[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-sip"
version = "1.0.0"
description = "Minimal SIP voice agent backed by OpenAI Realtime"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "websockets>=13", "httpx>=0.27", "mcp>=1.0,<2", "audioop-lts>=0.2.1; python_version >= '3.13'"]

[project.scripts]
agent-sip = "app.main:cli"
agent-sip-mcp = "app.mcp_bridge:cli"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
